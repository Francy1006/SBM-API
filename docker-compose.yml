version: '3.8'

services:
  api:
    container_name: sbm-core
    build: ./core
    command: sh -c "sleep 10s; python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8082:8000"
    env_file:
      - ./.env
    volumes:
      - ./core:/usr/src/app/core
      - ./franchise:/usr/src/app/franchise
      - ./templates:/usr/src/app/templates
      - ./manage.py:/usr/src/app/manage.py
    networks:
      - sbm-network

networks:
  sbm-network:
    external: true
